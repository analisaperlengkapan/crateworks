name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    env:
      # `rust-toolchain.toml` pins `stable` and would otherwise win, quietly
      # turning this job into a second run of the `test` job. RUSTUP_TOOLCHAIN
      # outranks the toolchain file, so the floor is really exercised.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The exact floor. Keep in step with `rust-version` in Cargo.toml: a floor
      # no job compiles against is just a claim, and this one was wrong before.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.88.0"
          components: clippy
          override: true
      - run: rustc --version
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The README and doc examples must build on the floor too, not just on
      # stable: `--all-targets` skips doctests, so this is the only step that
      # compiles them here.
      - run: cargo test --workspace --doc

  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      # --all-targets skips doctests, so the examples in src/ and in every
      # README would never be compiled by CI without these two steps.
      - run: cargo test --workspace --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      # A crate that credits an upstream project in its code must name it in
      # NOTICE; stdnum-rs once cited python-stdnum in src/id/mod.rs while its
      # NOTICE said nothing. No compiler catches that.
      - run: python3 scripts/check_attribution.py
