name: Release

# Tag-driven, one crate per tag: pushing `xmlkit-v0.1.1` publishes xmlkit at
# 0.1.1 and nothing else. The crates version independently, so there is no bare
# `v<version>` tag - it could not say which crate it meant. A mistaken `v0.1.1`
# still starts this workflow (see the filter below) so that it fails with an
# explanation rather than matching nothing and looking like success.
#
# `workflow_dispatch` is there for a re-run after a partial release; it takes the
# tag as an input. A crate whose version is already on crates.io is reported and
# skipped rather than failing the run, so a second run finishes the rest.
#
# A push carrying several tags starts this workflow ONCE, for one of them, not
# once per tag: `git push --tags` with seventeen tags produces a single run and
# sixteen releases never appear. Push one tag at a time, or dispatch the rest by
# hand. The step order is deliberate for the same reason - a wrong tag fails
# before the toolchain is installed.
on:
  push:
    # `*-v*` is the real tag shape. `v*` is here only so a mistaken bare
    # `v0.1.1` tag starts the workflow and fails at the check below with an
    # explanation, instead of matching nothing and looking like success.
    tags: ["*-v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. xmlkit-v0.1.1"
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# The crates.io upload uses a secret token, not GITHUB_TOKEN. `contents: write`
# is for the GitHub release at the end, which is created with the built-in token.
permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: the release notes are built
      # from `git log` over the crate's directory and from its previous tag, and
      # a shallow checkout would silently produce an empty range.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The tag names one crate and one version, and the version has to be the
      # one in that crate's manifest - the tag is what a reader trusts, so a
      # disagreement stops the release instead of publishing something the tag
      # does not name. A bare `v<version>` tag is refused here too, so a manual
      # dispatch cannot fall back to releasing everything.
      - name: Check the tag names one crate
        run: python3 scripts/publish.py --check-tag "$RELEASE_TAG"

      # Checked before the toolchain is installed, so a missing or expired
      # secret fails in seconds instead of after the build, at the upload. The
      # token is a repository secret; this step never prints it.
      - name: Check the crates.io token
        run: python3 scripts/check_token.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # A crate that credits an upstream project in its code must name it in
      # NOTICE. No compiler catches that, and a release is the last moment to.
      - run: python3 scripts/check_attribution.py

      # Dry-run first: this catches a manifest that will not package before
      # anything is uploaded, and an upload cannot be undone. No `--strict`: a
      # crate that depends on another here is legitimately "blocked" until that
      # dependency is uploaded, and --strict would fail the release before it
      # started.
      - run: python3 scripts/publish.py --tag "$RELEASE_TAG"

      # Notes are generated from the commits that touched this crate only, so a
      # release for one crate does not list the other sixteen. `--tag` selects
      # both the crate and the version, the same way the publish steps did.
      - name: Generate the release notes
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --out notes.md

      # `--yes` skips the interactive confirmation, which no runner can answer.
      # The token is a crates.io API token with publish scope, stored as a
      # repository secret; `cargo publish` reads it from CARGO_REGISTRY_TOKEN.
      - name: Publish
        run: python3 scripts/publish.py --publish --yes --tag "$RELEASE_TAG"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs.rs builds asynchronously after the upload, so this only waits for
      # the version to appear in the index, not for the docs to be live. The tag
      # is read through the same parser the release used, so this cannot end up
      # checking a different crate than the one just uploaded.
      - name: Confirm the crate is in the index
        run: |
          python3 - <<'PY'
          import importlib.util, os, urllib.error, urllib.request

          spec = importlib.util.spec_from_file_location("publish", "scripts/publish.py")
          publish = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publish)

          crate, version = publish.crates_from_tag(os.environ["RELEASE_TAG"])
          _, _, manifests = publish.load_manifests()
          declared = publish.version_of(manifests[crate])
          if declared != version:
              raise SystemExit(f"{crate} manifest says {declared}, tag says {version}")

          # urlopen raises on 4xx rather than returning a status, so the absent
          # case is an exception, not a code to compare.
          url = f"https://crates.io/api/v1/crates/{crate}/{version}"
          try:
              code = urllib.request.urlopen(url).status
          except urllib.error.HTTPError as error:
              code = error.code
          print(f"{crate} {version} -> HTTP {code}")
          if code != 200:
              raise SystemExit(f"{crate} {version} is not in the crates.io index")
          PY

      # Idempotent, so a re-run after a partial release updates the notes instead
      # of failing because the release already exists.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file notes.md \
              --verify-tag
          fi
