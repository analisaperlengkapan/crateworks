name: Release

# Tag-driven: pushing `v0.1.0` publishes every crate at the version in its
# manifest. `workflow_dispatch` is there for a re-run after a partial release;
# a crate whose version is already on crates.io is reported and skipped rather
# than failing the run, so a second run finishes the rest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Publishing is an upload, not a repository write: the release token comes from
# a secret, so the GITHUB_TOKEN itself stays read-only.
permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The tag and the manifests have to agree, or the release publishes a
      # version nobody asked for. `v0.1.0` is the tag; the crates carry 0.1.0.
      - name: Check the tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import glob, sys, tomllib

          tag = sys.argv[1].removeprefix("v")
          wrong = [
              (m, tomllib.load(open(m, "rb"))["package"]["version"])
              for m in sorted(glob.glob("crates/*/Cargo.toml"))
              if tomllib.load(open(m, "rb"))["package"]["version"] != tag
          ]
          for manifest, version in wrong:
              print(f"::error file={manifest}::version {version} does not match tag {tag}")
          sys.exit(1 if wrong else 0)
          PY

      # A crate that credits an upstream project in its code must name it in
      # NOTICE. No compiler catches that, and a release is the last moment to.
      - run: python3 scripts/check_attribution.py

      # Dry-run first: this catches a manifest that will not package before
      # anything is uploaded, and an upload cannot be undone. No `--strict`:
      # on a fresh version every crate that depends on another crate here is
      # legitimately "blocked" until that dependency is uploaded, and --strict
      # would fail the release before it started.
      - run: python3 scripts/publish.py

      # `--yes` skips the interactive confirmation, which no runner can answer.
      # The token is a crates.io API token with publish scope, stored as a
      # repository secret; `cargo publish` reads it from CARGO_REGISTRY_TOKEN.
      - name: Publish
        run: python3 scripts/publish.py --publish --yes
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # docs.rs builds asynchronously after the upload, so this only waits for
      # the version to appear in the index, not for the docs to be live.
      - name: Confirm the crates are in the index
        run: |
          python3 - <<'PY'
          import glob, tomllib, urllib.request

          missing = []
          for manifest in sorted(glob.glob("crates/*/Cargo.toml")):
              package = tomllib.load(open(manifest, "rb"))["package"]
              name, version = package["name"], package["version"]
              url = f"https://crates.io/api/v1/crates/{name}/{version}"
              code = urllib.request.urlopen(url).status
              print(f"{name} {version} -> HTTP {code}")
              if code != 200:
                  missing.append(f"{name} {version}")
          if missing:
              raise SystemExit("not in the crates.io index: " + ", ".join(missing))
          PY
