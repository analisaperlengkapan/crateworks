[workspace]
resolver = "3"
members = [
    "crates/xmlkit",
    "crates/holidays-rs",
    "crates/hijridate",
    "crates/stdnum-rs",
    "crates/spreadsheet-formula",
    "crates/iso20022-rs",
    "crates/soap-client",
    "crates/eu-vat",
    "crates/iso8583-msg",
    "crates/arabic",
    "crates/factur-x",
    "crates/wssec",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/analisaperlengkapan/crateworks"
authors = ["Yayasan Pesantren Cipansor and contributors"]

[workspace.dependencies]
xmlkit = { version = "0.1.0", path = "crates/xmlkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
